name: fetch-footage

# GitHub's own runners have unrestricted internet, so they can reach the stock
# footage APIs even though the sandbox that authored this plan cannot.  The
# workflow downloads every clip the plan needs, trims it to the 10s the build
# consumes, and commits them to the `footage-cache` branch so the sandbox can
# pull them with plain git (the only host reachable from there).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-footage.yml"
      - "download_footage.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # the secret is named PEXELS_API_KEY but holds the Pixabay key the user
      # actually has; it is mapped onto the variable the downloader reads.
      - name: check the key is present
        env:
          PIXABAY_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "::error::secret PEXELS_API_KEY is not set."
            echo "Add it in GitHub: Settings -> Secrets and variables ->"
            echo "Actions -> New repository secret."
            exit 1
          fi
          echo "key present (${#PIXABAY_API_KEY} chars)"

      - name: download the 61 clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FOOTAGE_PROVIDER: pixabay
        run: |
          set +e
          echo "=== direct API probe ===" > /tmp/diag.txt
          code=$(curl -s -o /tmp/probe.json -w "%{http_code}" \
            "https://pixabay.com/api/videos/?key=${PIXABAY_API_KEY}&q=rain&per_page=3")
          echo "HTTP status: $code" >> /tmp/diag.txt
          head -c 500 /tmp/probe.json >> /tmp/diag.txt
          echo "" >> /tmp/diag.txt
          echo "key length: ${#PIXABAY_API_KEY}" >> /tmp/diag.txt
          echo "=== downloader output ===" >> /tmp/diag.txt
          python3 download_footage.py --provider pixabay >> /tmp/diag.txt 2>&1
          echo "downloader exit code: $?" >> /tmp/diag.txt
          cp /tmp/diag.txt brand/footage/_diag.txt
          cat /tmp/diag.txt

      - name: trim each clip to the 10s the build consumes
        if: ${{ hashFiles('brand/footage/scene-*.mp4') != '' }}
        run: |
          shopt -s nullglob
          for f in brand/footage/scene-*.mp4; do
            base=$(basename "$f")
            # 10s, capped at 1080p, no audio (the timeline uses narration only)
            ffmpeg -y -i "$f" -t 10 \
              -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" \
              -c:v libx264 -preset veryfast -crf 23 -an \
              -movflags +faststart "/tmp/$base"
            mv "/tmp/$base" "$f"
            echo "trimmed $base ($(du -h "$f" | cut -f1))"
          done

      - name: commit the clips to footage-cache
        if: ${{ always() }}
        run: |
          git config user.name  "footage-bot"
          git config user.email "footage-bot@users.noreply.github.com"
          git checkout -B footage-cache
          git add -f brand/footage/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "footage: clips from Pixabay trimmed to 10s @1080p (+diagnostics)"
            git push -f origin footage-cache
            echo "pushed $(git rev-parse --short HEAD) to footage-cache"
          fi

      - name: summary
        if: ${{ always() }}
        run: |
          n=$(ls brand/footage/scene-*.mp4 2>/dev/null | wc -l)
          sz=$(du -sh brand/footage 2>/dev/null | cut -f1)
          echo "### footage ready" >> $GITHUB_STEP_SUMMARY
          echo "- clips: $n / 61" >> $GITHUB_STEP_SUMMARY
          echo "- total size: $sz" >> $GITHUB_STEP_SUMMARY
          echo "- branch: \`footage-cache\`" >> $GITHUB_STEP_SUMMARY
