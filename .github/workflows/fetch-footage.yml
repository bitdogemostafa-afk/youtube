name: fetch-footage

# GitHub's own runners have unrestricted internet, so they can reach the stock
# footage APIs even though the sandbox that authored this plan cannot.  The
# workflow downloads every clip the plan needs, trims it to the 10s the build
# consumes, and commits them to the `footage-cache` branch so the sandbox can
# pull them with plain git (the only host reachable from there).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-footage.yml"
      - "download_footage.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tool check
        run: |
          ffmpeg -version | head -1
          python3 --version
          df -h . | tail -1

      # the secret is named PEXELS_API_KEY but holds the Pixabay key the user
      # actually has; it is mapped onto the variable the downloader reads.
      - name: download the 61 clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FOOTAGE_PROVIDER: pixabay
        run: |
          set +e
          D=brand/footage/_diag.txt
          mkdir -p brand/footage
          {
            echo "=== API probe ==="
            code=$(curl -s -o /tmp/probe.json -w "%{http_code}" \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36" \
              "https://pixabay.com/api/videos/?key=${PIXABAY_API_KEY}&q=rain&per_page=3")
            echo "HTTP status: $code   key length: ${#PIXABAY_API_KEY}"
            echo "=== downloader ==="
          } > "$D"
          python3 download_footage.py --provider pixabay >> "$D" 2>&1
          echo "downloader exit code: $?" >> "$D"
          echo "=== result ===" >> "$D"
          echo "mp4 files: $(ls brand/footage/scene-*.mp4 2>/dev/null | wc -l) / 61" >> "$D"
          du -sh brand/footage >> "$D" 2>&1
          cat "$D"

      # publish the diagnostics straight away so the sandbox can read them even
      # if a later step blows up
      - name: publish diagnostics
        if: ${{ always() }}
        run: |
          git config user.name  "footage-bot"
          git config user.email "footage-bot@users.noreply.github.com"
          git checkout -B footage-cache
          git add -f brand/footage/_diag.txt
          git commit -m "diag: $(date -u +%H:%M:%S)" || echo "nothing to commit"
          git push -f origin footage-cache || echo "push failed"

      - name: trim each clip to the 10s the build consumes
        if: ${{ hashFiles('brand/footage/scene-*.mp4') != '' }}
        run: |
          shopt -s nullglob
          ok=0; bad=0
          for f in brand/footage/scene-*.mp4; do
            base=$(basename "$f")
            # 10s, capped at 1080p, no audio (the timeline uses narration only)
            if ffmpeg -y -i "$f" -t 10 \
                 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080" \
                 -c:v libx264 -preset veryfast -crf 23 -an \
                 -movflags +faststart "/tmp/$base" 2>/tmp/ff.log; then
              mv "/tmp/$base" "$f"; ok=$((ok+1))
            else
              echo "TRIM FAILED $base:"; tail -3 /tmp/ff.log; bad=$((bad+1))
            fi
          done
          echo "trimmed ok=$ok failed=$bad"
          echo "trimmed ok=$ok failed=$bad" >> brand/footage/_diag.txt

      - name: commit the clips to footage-cache
        if: ${{ always() }}
        run: |
          git config user.name  "footage-bot"
          git config user.email "footage-bot@users.noreply.github.com"
          git checkout -B footage-cache
          git add -f brand/footage/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "footage: clips trimmed to 10s @1080p" || echo "commit failed"
            git push -f origin footage-cache || echo "push failed"
          fi
          echo "clips on branch: $(git ls-files brand/footage/ | grep -c scene-)"

      - name: summary
        if: ${{ always() }}
        run: |
          n=$(ls brand/footage/scene-*.mp4 2>/dev/null | wc -l)
          sz=$(du -sh brand/footage 2>/dev/null | cut -f1)
          echo "### footage" >> $GITHUB_STEP_SUMMARY
          echo "- clips: $n / 61" >> $GITHUB_STEP_SUMMARY
          echo "- size: $sz" >> $GITHUB_STEP_SUMMARY
